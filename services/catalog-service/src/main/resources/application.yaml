spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trazasan
    username: user
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: catalog

  flyway:
    enabled: true
    default-schema: catalog
    schemas:
      - catalog
server:
  port: 8081
  servlet:
    context-path:

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
