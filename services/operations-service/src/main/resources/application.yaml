spring:
  application:
    name: operations-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trazasan
    username: user
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: operations

  flyway:
    enabled: true
    default-schema: operations
    schemas:
      - operations

server:
  port: 8083
  servlet:
    context-path:

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs