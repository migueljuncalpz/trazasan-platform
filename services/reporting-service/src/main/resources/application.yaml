spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trazasan
    username: user
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: reporting

  flyway:
    enabled: true
    default-schema: reporting
    schemas:
      - reporting

server:
  port: 8084
  servlet:
    context-path:

management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs