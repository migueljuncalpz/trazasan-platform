spring:
  application:
    name: traceability-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trazasan
    username: user
    password: password
  jpa:
    properties:
      hibernate:
        default_schema: traceability

  flyway:
    enabled: true
    default-schema: traceability
    schemas:
      - traceability

server:
  port: 8082
  servlet:
    context-path:

management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs