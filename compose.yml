services:
  postgres:
    image: postgres:17-alpine
    container_name: trazasan-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trazasan
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trazasan"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - trazasan-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d

volumes:
  trazasan-postgres-data: